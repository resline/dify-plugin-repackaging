version: '3.8'

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Backend with Celery worker and beat
  app:
    build: ./backend
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - BACKEND_CORS_ORIGINS=["https://dify-plugin.resline.net"]
      - TEMP_DIR=/app/temp
      - SCRIPTS_DIR=/app/scripts
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-10}
      - FILE_RETENTION_HOURS=${FILE_RETENTION_HOURS:-24}
      # Authentication password - leave empty to disable authentication
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
    volumes:
      - temp-data:/app/temp
      - ./backend/scripts:/app/scripts:ro
      - ./frontend/dist:/app/static:ro
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: |
      sh -c "
        # Start Celery worker in background
        celery -A app.workers.celery_app worker --loglevel=info --detach &&
        # Start Celery beat in background
        celery -A app.workers.celery_app beat --loglevel=info --detach &&
        # Start FastAPI app
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

volumes:
  temp-data:
  redis-data:
